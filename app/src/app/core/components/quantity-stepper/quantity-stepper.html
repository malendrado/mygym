<div class="stepper">
  @if (label) {
    <span class="stepper__label">{{ label }}</span>
  }
  <div class="stepper__control">
    <button
      type="button"
      class="stepper__btn"
      [disabled]="disabled() || value() <= min"
      (click)="decrement()"
      [attr.aria-label]="label ? 'Restar a ' + label : 'Restar'"
    >
      <ion-icon name="remove-outline" aria-hidden="true"></ion-icon>
    </button>
    <input
      class="stepper__value"
      type="number"
      inputmode="numeric"
      [attr.aria-label]="label || null"
      [value]="value()"
      [disabled]="disabled()"
      (change)="onManualInput($any($event.target).value)"
    />
    <button
      type="button"
      class="stepper__btn"
      [disabled]="disabled() || value() >= max"
      (click)="increment()"
      [attr.aria-label]="label ? 'Sumar a ' + label : 'Sumar'"
    >
      <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>
</div>
