<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding login-content">
  <div class="login-card">
    <div class="login-card__badge">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g id="icon">
          <path fill="currentColor" fill-rule="evenodd" d="
            M128,40 H384 A88,88 0 0 1 472,128 V384 A88,88 0 0 1 384,472 H128 A88,88 0 0 1 40,384 V128 A88,88 0 0 1 128,40 Z
            M128,72 H384 A56,56 0 0 1 440,128 V384 A56,56 0 0 1 384,440 H128 A56,56 0 0 1 72,384 V128 A56,56 0 0 1 128,72 Z
          "/>
          <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
            <path d="M120,360 L120,90 L256,260 L392,90 L392,360" fill="none" stroke="currentColor" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
            <path fill="currentColor" fill-rule="evenodd" d="
              M224,360 L172,450.07 L68,450.07 L16,360 L68,269.93 L172,269.93 Z
              M148,360 A28,28 0 1 0 92,360 A28,28 0 1 0 148,360 Z
            "/>
          </g>
        </g>
      </svg>
    </div>
    <h1>Ingresa a mygym</h1>
    <p>Usa tu cuenta de Google para reservar clases o administrar tu gimnasio.</p>
    <div class="google-auth">
      @if (signingIn()) {
        <div class="login-loading">
          <ion-spinner name="crescent"></ion-spinner>
          <p>Ingresando...</p>
        </div>
      } @else {
        <asl-google-signin-button type="standard" size="large" text="continue_with" shape="pill" theme="outline" logo_alignment="left" />
      }
    </div>
    @if (errorMessage()) {
      <ion-text color="danger">
        <p>{{ errorMessage() }}</p>
      </ion-text>
    }
  </div>
</ion-content>
