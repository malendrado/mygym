<div class="legal-page">
  <div class="legal-page__inner">
    <a routerLink="/" class="legal-page__back">← mygym</a>
    <h1>Preguntas frecuentes</h1>
    <p class="legal-page__intro">Para dueños de gimnasios que están evaluando contratar mygym o que ya lo usan.</p>

    @for (section of sections; track section.title) {
      <section class="legal-page__section">
        <h2>{{ section.title }}</h2>
        @for (item of section.items; track item.question) {
          <div class="legal-page__item">
            <h3>{{ item.question }}</h3>
            <p>{{ item.answer }}</p>
          </div>
        }
      </section>
    }
  </div>
</div>
