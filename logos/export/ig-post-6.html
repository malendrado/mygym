<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    background-color: #1e2c30;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44IiBudW1PY3RhdmVzPSIyIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PGZlQ29sb3JNYXRyaXggdHlwZT0ibWF0cml4IiB2YWx1ZXM9IjAgMCAwIDAgMSAwIDAgMCAwIDEgMCAwIDAgMCAxIDAgMCAwIDAuMDUgMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==");
    font-family: 'Barlow', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    color: #eaf6f7;
    position: relative;
    overflow: hidden;
  }

  .mark {
    position: absolute;
    top: -120px;
    right: -100px;
    width: 620px;
    height: 620px;
    opacity: 0.14;
  }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 90px 90px 80px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand svg { width: 56px; height: 56px; }

  .brand span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.01em;
  }

  .eyebrow {
    display: inline-block;
    width: fit-content;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #c6ff3d;
    background: rgba(198, 255, 61, 0.12);
    border: 2px solid rgba(198, 255, 61, 0.35);
    padding: 10px 24px;
    border-radius: 999px;
    margin-bottom: 36px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1.04;
    max-width: 820px;
    margin-bottom: 40px;
  }

  h1 em {
    font-style: normal;
    color: #c6ff3d;
  }

  .cards {
    display: flex;
    gap: 24px;
  }

  .card {
    flex: 1;
    background: #28393e;
    border: 1px solid #33474d;
    border-radius: 20px;
    padding: 32px 28px;
  }

  .card b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    color: #c6ff3d;
    margin-bottom: 10px;
  }

  .card span {
    font-size: 24px;
    color: #a9c2c6;
    line-height: 1.35;
    display: block;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-cta {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: #1a2b00;
    background: #c6ff3d;
    padding: 20px 40px;
    border-radius: 999px;
  }

  .footer-url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 30px;
    color: #a9c2c6;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#c6ff3d" fill-rule="evenodd" d="M128,40 H384 A88,88 0 0 1 472,128 V384 A88,88 0 0 1 384,472 H128 A88,88 0 0 1 40,384 V128 A88,88 0 0 1 128,40 Z M128,72 H384 A56,56 0 0 1 440,128 V384 A56,56 0 0 1 384,440 H128 A56,56 0 0 1 72,384 V128 A56,56 0 0 1 128,72 Z"/>
    <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
      <path d="M120,360 L120,90 L256,260 L392,90 L392,360" fill="none" stroke="#c6ff3d" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
      <path fill="#c6ff3d" fill-rule="evenodd" d="M224,360 L172,450.07 L68,450.07 L16,360 L68,269.93 L172,269.93 Z M148,360 A28,28 0 1 0 92,360 A28,28 0 1 0 148,360 Z"/>
      <path fill="#c6ff3d" fill-rule="evenodd" d="M496,360 L444,450.07 L340,450.07 L288,360 L340,269.93 L444,269.93 Z M420,360 A28,28 0 1 0 364,360 A28,28 0 1 0 420,360 Z"/>
    </g>
  </svg>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#c6ff3d" fill-rule="evenodd" d="M128,40 H384 A88,88 0 0 1 472,128 V384 A88,88 0 0 1 384,472 H128 A88,88 0 0 1 40,384 V128 A88,88 0 0 1 128,40 Z M128,72 H384 A56,56 0 0 1 440,128 V384 A56,56 0 0 1 384,440 H128 A56,56 0 0 1 72,384 V128 A56,56 0 0 1 128,72 Z"/>
        <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
          <path d="M120,360 L120,90 L256,260 L392,90 L392,360" fill="none" stroke="#c6ff3d" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
          <path fill="#c6ff3d" fill-rule="evenodd" d="M224,360 L172,450.07 L68,450.07 L16,360 L68,269.93 L172,269.93 Z M148,360 A28,28 0 1 0 92,360 A28,28 0 1 0 148,360 Z"/>
          <path fill="#c6ff3d" fill-rule="evenodd" d="M496,360 L444,450.07 L340,450.07 L288,360 L340,269.93 L444,269.93 Z M420,360 A28,28 0 1 0 364,360 A28,28 0 1 0 420,360 Z"/>
        </g>
      </svg>
      <span>mygym</span>
    </div>

    <div>
      <span class="eyebrow">Cómo se instala</span>
      <h1>Un código.<br><em>Nada más.</em></h1>
      <div class="cards">
        <div class="card">
          <b>📺 En la TV</b>
          <span>Abres mygym.cl/tv y aparece un código de 6 letras en pantalla.</span>
        </div>
        <div class="card">
          <b>💻 Desde tu panel</b>
          <span>Lo escribes una sola vez. La TV nunca vuelve a pedir nada.</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="footer-cta">Solicita una demo</span>
      <span class="footer-url">mygym.cl</span>
    </div>
  </div>
</body>
</html>
