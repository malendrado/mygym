<!--
  Plantilla de email genérica — mismo armazón visual que admin-invite.html
  (insignia circular, tarjeta oscura, botón CTA), reutilizada para distintos
  momentos del ciclo de vida de un socio (alta, aviso al admin, pago
  confirmado). Lo que cambia entre envíos es solo el contenido, nunca la
  estructura — así toda la mensajería de mygym se ve consistente.

  Placeholders:
    {{PREHEADER}}         texto oculto que se ve en la lista de la bandeja de entrada
    {{GYM_NAME}}          nombre del gimnasio
    {{THEME_COLOR}} / {{THEME_CONTRAST}}  igual que en admin-invite.html
    {{LOGO_BADGE_INNER}}  igual que en admin-invite.html (arma el service, nunca crudo)
    {{BADGE_LABEL}}       texto corto en la píldora bajo el nombre del gym (ej: "Nuevo socio", "Pago confirmado")
    {{HEADLINE}}          título del cuerpo (ej: "¡Bienvenido a Fortis!")
    {{BODY_HTML}}         uno o más <p> ya armados por el service (permite <strong>, nunca HTML sin escapar de datos de usuario)
    {{CTA_TEXT}} / {{CTA_URL}}  botón principal
    {{FOOTER_TEXT}}       línea de pie, distinta según el destinatario (socio vs. admin)

  Mismas reglas de HTML de email que admin-invite.html: todo con tablas y estilos inline.
-->
<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{HEADLINE}}</title>
<!--[if mso]>
<style>
  table { border-collapse: collapse; }
  .fallback-font { font-family: Arial, Helvetica, sans-serif !important; }
</style>
<![endif]-->
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    {{PREHEADER}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">

          <tr>
            <td style="padding:0 8px 20px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#5b6b70;">
              mygym &middot; {{GYM_NAME}}
            </td>
          </tr>

          <tr>
            <td style="background-color:#1c282c; border-radius:16px; padding:0; overflow:hidden;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:28px 32px 20px; border-bottom:1px dashed #3a4a4f;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="64" valign="middle" style="padding-right:16px;">
                          <table role="presentation" width="64" height="64" cellpadding="0" cellspacing="0" border="0" style="background-color:{{THEME_COLOR}}; border-radius:32px; width:64px; height:64px;">
                            <tr>
                              <td align="center" valign="middle" style="width:64px; height:64px; font-family:Arial Narrow, Helvetica Neue, Arial, sans-serif; font-size:26px; font-weight:bold; color:{{THEME_CONTRAST}};">
                                {{LOGO_BADGE_INNER}}
                              </td>
                            </tr>
                          </table>
                        </td>
                        <td valign="middle">
                          <div style="font-family:Arial Narrow, Helvetica Neue, Arial, sans-serif; font-size:26px; line-height:1.1; color:#eaf6f7; font-weight:bold; letter-spacing:0.5px;">
                            {{GYM_NAME}}
                          </div>
                          <div style="margin-top:6px;">
                            <span style="display:inline-block; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:{{THEME_CONTRAST}}; background-color:{{THEME_COLOR}}; border-radius:999px; padding:4px 10px;">
                              {{BADGE_LABEL}}
                            </span>
                          </div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:28px 32px 8px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:20px; line-height:1.3; color:#eaf6f7; font-weight:bold;">
                    {{HEADLINE}}
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 32px 24px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:15px; line-height:1.6; color:#a9c2c6;">
                    {{BODY_HTML}}
                  </td>
                </tr>

                <tr>
                  <td style="padding:0 32px 8px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="background-color:{{THEME_COLOR}}; border-radius:999px;">
                          <a href="{{CTA_URL}}" target="_blank" style="display:inline-block; padding:14px 32px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:15px; font-weight:bold; letter-spacing:0.3px; color:{{THEME_CONTRAST}}; text-decoration:none;">
                            {{CTA_TEXT}}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 32px 28px; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.5; color:#7d9296;">
                    ¿El botón no funciona? Copia este enlace:<br />
                    <span style="font-family:'Courier New', Courier, monospace; color:#a9c2c6; word-break:break-all;">{{CTA_URL}}</span>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <tr>
            <td style="padding:20px 8px 0; font-family:Helvetica Neue, Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#5b6b70;">
              {{FOOTER_TEXT}}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
