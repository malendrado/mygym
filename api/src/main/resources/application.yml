spring:
  application:
    name: mygym-api
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 25
      min-spare: 5

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.mygym.cl,https://mygym.cl,http://localhost:4300}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:mygym <onboarding@resend.dev>}
  flow:
    api-key: ${FLOW_API_KEY:}
    secret-key: ${FLOW_SECRET_KEY:}
    # Sandbox por default a propósito — nunca apuntar a producción sin que
    # el usuario cambie esta env var a mano, ver plan de integración.
    base-url: ${FLOW_BASE_URL:https://sandbox.flow.cl/api}
    return-url: ${FLOW_RETURN_URL:https://www.mygym.cl/member?checkout=return}
    webhook-url: ${FLOW_WEBHOOK_URL:https://api-production-be95.up.railway.app/api/public/flow/webhook}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
