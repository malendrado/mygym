spring:
  application:
    name: mygym-api
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # 10 (antes 5): en la hora punta 5 socios reservando la misma clase ocupaban todo el pool y la TV, /me y el check-in hacían cola.
      # Con 1 instancia de Railway queda bajo el pool por defecto del pooler de Supabase (15); con 2 instancias bajarlo por variable.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 3
      # Con 25 hilos de Tomcat y 5 conexiones, quien espera una conexión no debe colgarse 30 s (el valor por defecto).
      connection-timeout: 5000
  # Todas las llamadas salientes que usan RestClient.Builder (Resend, Flow, Gemini) tienen tope de espera: antes un
  # servicio externo colgado dejaba las requests (y sus conexiones de BD) esperando sin límite.
  http:
    client:
      connect-timeout: 3s
      # 20 s: la sugerencia de logo con Gemini puede tardar más de 10 s; Resend y Flow responden en pocos segundos.
      read-timeout: 20s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 25
      min-spare: 5
  # JSON comprimido (listas de socios, agenda, resumen): las fotos en base64 comprimen poco, el resto mucho.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

app:
  # false = no corre ninguna tarea programada (copia de respaldo conectada a la base real). Por defecto activas.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  jwt:
    secret: ${APP_JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    # Solo los orígenes de producción por defecto: un localhost permitido en prod deja que cualquier página
    # corriendo en la máquina de una víctima llame a la API con su token. En desarrollo local ng serve usa el
    # proxy a :8080 (mismo origen, sin CORS); si se necesita llamar directo, definir
    # APP_CORS_ALLOWED_ORIGINS=http://localhost:4300 solo en ese entorno.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.mygym.cl,https://mygym.cl}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:mygym <onboarding@resend.dev>}
  contact:
    # Contacto de mygym que ven los administradores cuando su gimnasio esta en pausa (ver GymStatusController).
    whatsapp: ${MYGYM_CONTACT_WHATSAPP:56964641042}
    email: ${MYGYM_CONTACT_EMAIL:contacto@mygym.cl}
  push:
    # Claves VAPID del push web (ver PushSender). Sin ellas el push queda desactivado y GET /api/push/public-key da 204.
    vapid:
      public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      subject: ${PUSH_VAPID_SUBJECT:mailto:contacto@mygym.cl}
  flow:
    # api-key/secret-key YA NO son globales — cada gym tiene la suya propia (Gym.flowApiKey/
    # flowSecretKey, cifradas, cargadas por el super-admin en "Cuenta Pago Online"). Acá solo
    # queda infraestructura compartida (misma base URL / URLs de retorno para todos los gyms).
    # Sandbox por default a propósito — nunca apuntar a producción sin que
    # el usuario cambie esta env var a mano, ver plan de integración.
    base-url: ${FLOW_BASE_URL:https://sandbox.flow.cl/api}
    # Flow hace un POST del navegador a esta URL (no un GET) — no puede apuntar directo a la
    # SPA (Vercel solo sirve GET ahí, un POST da 405). Apunta al backend, que rebota con un
    # 302 hacia member-return-url (GET, eso sí lo puede servir Vercel). Ver PublicFlowController.
    return-url: ${FLOW_RETURN_URL:https://api-production-be95.up.railway.app/api/public/flow/return}
    member-return-url: ${FLOW_MEMBER_RETURN_URL:https://www.mygym.cl/member?checkout=return}
    webhook-url: ${FLOW_WEBHOOK_URL:https://api-production-be95.up.railway.app/api/public/flow/webhook}

  # Suscripcion de cada gimnasio a mygym: se paga a la cuenta Flow PROPIA de mygym (no a la de cada gimnasio). Sin llaves, el
  # pago con Flow queda desactivado y solo queda la transferencia.
  mygym-flow:
    api-key: ${MYGYM_FLOW_API_KEY:}
    secret-key: ${MYGYM_FLOW_SECRET_KEY:}
    return-url: ${MYGYM_FLOW_RETURN_URL:https://api-production-be95.up.railway.app/api/public/flow/mygym-return}
    member-return-url: ${MYGYM_FLOW_MEMBER_RETURN_URL:https://www.mygym.cl/gym-admin?subscription=return}
    webhook-url: ${MYGYM_FLOW_WEBHOOK_URL:https://api-production-be95.up.railway.app/api/public/flow/mygym-webhook}
  # Cuenta (de Cortes Dev) a la que transfieren los gimnasios. Variables de entorno, nunca escritas en el codigo.
  mygym-bank:
    holder: ${MYGYM_BANK_HOLDER:}
    rut: ${MYGYM_BANK_RUT:}
    bank: ${MYGYM_BANK_NAME:}
    account-type: ${MYGYM_BANK_ACCOUNT_TYPE:}
    account-number: ${MYGYM_BANK_ACCOUNT_NUMBER:}
    email: ${MYGYM_BANK_EMAIL:contacto@mygym.cl}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  # Apagado por default (auditoría de seguridad 2026-10-09: quedaba público sin auth en
  # producción) — levantar con SPRINGDOC_ENABLED=true solo para debug local puntual. El acceso
  # en producción además exige rol SUPER_ADMIN (ver SecurityConfig), esto es la capa adicional.
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
